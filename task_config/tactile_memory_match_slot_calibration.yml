# Public tactile_probe.v4 calibration for frozen response expressions.
# 56 ordered reference/distractor pairs x 5 repetitions = 280 episodes.
# The task writes only probe segments and canonical summaries by default.
save_dir: ./data

decimation: 1
save_frequency: 0
video_frequency: 0
render_frequency: 0
preserve_raw_cache: false
save_hdf5: false
headless: true
livestream: 0

random_texture: false

use_seed: true
episode_num: 280
start_seed: 3000
max_seed: 3279

sensor_type: gsmini
reset_time_limit: 900
step_lim: 500
max_save_frames: 5000
live_preview_enabled: false

task_cfg_overrides:
  identity_pair_schedule: balanced_ordered_pairs
  probe_min_bilateral_ratio: 0.8
  calibration_probe_only: true
  record_tactile_timeline: false

observations:
  tactile: ['marker', 'depth']
