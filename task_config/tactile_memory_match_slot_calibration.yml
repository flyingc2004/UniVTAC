# Public tactile_probe.v2 collection for slot-design analysis.  The current
# task keeps its original four hidden physical variants; this config collects
# symmetric probe records without raw-frame or HDF5 storage.
save_dir: ./data

decimation: 1
save_frequency: 4
video_frequency: 0
render_frequency: 0
preserve_raw_cache: false
save_hdf5: false
headless: true
livestream: 0

random_texture: false

use_seed: true
episode_num: 120
start_seed: 2000
max_seed: 2119

sensor_type: gsmini
reset_time_limit: 900
step_lim: 500
max_save_frames: 5000
live_preview_enabled: false

task_cfg_overrides:
  identity_pair_schedule: balanced_ordered_pairs
  probe_capture_steps: 6
  probe_min_bilateral_ratio: 0.8

observations:
  tactile: ['marker', 'depth']
