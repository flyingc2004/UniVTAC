# Reproducible teaching demo: public tactile memory selects a same-mesh twin.
save_dir: ./data

decimation: 1
save_frequency: 4
video_frequency: 6
render_frequency: 0
preserve_raw_cache: false
save_hdf5: false
headless: true
livestream: 0

random_texture: false

use_seed: true
episode_num: 1
start_seed: 4002
max_seed: 4002

sensor_type: gsmini
reset_time_limit: 900
step_lim: 500
max_save_frames: 5000
live_preview_enabled: true
live_preview_path: ./data/tactile_memory_match_demo/tactile_memory_match_demo/latest_preview.jpg
live_preview_stride: 5
live_preview_jpeg_quality: 85

task_cfg_overrides:
  reference_class_key: light_smooth_soft
  distractor_class_key: light_smooth_rigid
  probe_min_bilateral_ratio: 0.8
  # Demo-only visual occluder around the candidate area. It has no collision,
  # so the official expert remains the same controlled probe and transport.
  occlusion_enabled: true

observations:
  camera: ['rgb', 'depth']
  tactile: ['rgb_marker', 'marker', 'depth']
  embodiment: ['joint', 'ee']
