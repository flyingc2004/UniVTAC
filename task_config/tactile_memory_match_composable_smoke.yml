# Physical gate for the same-mesh rigid/soft Can_d4cm variants.
save_dir: ./data

decimation: 1
save_frequency: 4
video_frequency: 1
render_frequency: 0
preserve_raw_cache: false
save_hdf5: false
headless: true
livestream: 0

random_texture: false

use_seed: true
episode_num: 1
start_seed: 4000
max_seed: 4000

sensor_type: gsmini
reset_time_limit: 900
step_lim: 500
max_save_frames: 5000
live_preview_enabled: false

task_cfg_overrides:
  reference_class_key: light_smooth_soft
  distractor_class_key: light_smooth_rigid
  probe_min_bilateral_ratio: 0.8

observations:
  tactile: ['marker', 'depth']
